  - id: task-8432
    title: "Исправить проблему производительности на сайте BIOUBORKA.UZ: показатель
      LCP (Largest Contentful Paint) на мобильных у..."
    description: >-
      Исправить проблему производительности на сайте BIOUBORKA.UZ: показатель
      LCP (Largest Contentful Paint) на мобильных устройствах превышает 2,5
      секунды (Google Search Console / PageSpeed Insights: "Значение показателя
      LCP слишком велико: более 2,5 с (мобильные устройства)").


      Нужно провести аудит причин медленного LCP и исправить их, чтобы LCP на
      мобильных стал ниже 2,5 с. Основные подозреваемые и направления работы:


      1. Главная страница (app/page.tsx, components/home-content.tsx) использует
      фоновое изображение герой-секции через CSS backgroundImage
      url('/assets/hero-cleaning.png') — PNG-файл, скорее всего, очень тяжёлый и
      является LCP-элементом. Нужно:
         - проверить размер public/assets/hero-cleaning.png (и других крупных ассетов в public/assets);
         - конвертировать/сжать hero-изображение в современный формат (WebP/AVIF) с сохранением качества и уменьшением веса в разы (например, через sharp-скрипт или иной штатный способ в проекте; при необходимости сохранить оригинал как fallback);
         - обеспечить предзагрузку (preload) критичного изображения героя (например, <link rel="preload" as="image"> через metadata/head или иной штатный Next.js способ), чтобы браузер начинал грузить его раньше;
         - если возможно и не ломает дизайн — перевести фон героя на next/image с priority + fill, чтобы получить автоматическую оптимизацию и правильные размеры/форматы.

      2. Проверить остальные тяжёлые изображения (фото галереи photo_*.jpg в
      public/assets, логотип logo.png, фото процедур): сжать/конвертировать в
      WebP где выгодно, убедиться что они не блокируют LCP (галерея должна
      грузиться лениво, не влиять на первый экран).


      3. Проверить другие факторы LCP: подключение Google Analytics (next/script
      afterInteractive не должен блокировать рендеринг), шрифты (font-display),
      тяжёлые клиентские бандлы, отсутствие blocking ресурсов на первом экране.


      4. Сохранить текущий зелёно-белый дизайн, три языка (русский, узбекская
      кириллица, узбекская латиница), фоновое фото hero-cleaning.png (визуально
      то же изображение), все разделы и функциональность (формы, админ-панель,
      аналитика, Telegram-уведомления).


      5. После правок убедиться, что typecheck, lint и build проходят. В summary
      перечислить: найденные причины медленного LCP (размеры файлов до/после),
      что именно изменено, и как пользователю проверить результат (PageSpeed
      Insights mobile / Search Console Core Web Vitals после деплоя).
    status: completed
    acceptance_criteria:
      - Запрос пользователя выполнен полностью
    meta:
      quick_implement_marker: quick_implement:call_b97afd3c9c8f417683736172
    summary: "Причина медленного LCP — герой-изображение hero-cleaning.png (829 КБ),

version: 1
tasks:
  - id: task-001
    title: Визуальная заглушка главной страницы
    description: >-
      Создать главную страницу сайта BIOUBORKA.UZ с приветственным блоком,
      навигацией и статическими данными-заглушками.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Реализовать только то, что пользователь увидит сразу при открытии
      приложения.
    status: completed
    acceptance_criteria:
      - Главная страница отображается без ошибок
      - Есть шапка с названием компании и навигацией
      - Есть подвал с контактами
    summary: "Создана главная страница BIOUBORKA.UZ с приветственным блоком
      (герой-секция с Leaf-иконкой, названием компании, теглайном и CTA), тремя
      карточками преимуществ биоуборки, шапкой с логотипом и навигацией
      (Главная, Услуги, О нас, Контакты), а также подвалом с контактами
      (телефон, email, Instagram, Telegram) и кратким описанием компании.
      Основные файлы: app/layout.tsx (шапка и подвал), app/page.tsx (основной
      контент)."
  - id: task-002
    title: Каталог услуг с ценами
    description: "Создать на главной странице блок с карточками услуг: уборка
      квартир, химчистка мебели, уборка после ремонта, поддерживающая уборка. У
      каждой карточки — название, описание, цена и кнопка «Заказать». Данные
      пока статические."
    status: completed
    acceptance_criteria:
      - Отображаются 4+ карточки услуг с названием, описанием и ценой
      - У каждой карточки есть кнопка «Заказать»
      - Карточки выглядят аккуратно на мобильных и десктопе
    summary:
      "Добавлен блок «Наши услуги» на главную страницу (app/page.tsx:139–180)
      с четырьмя карточками: уборка квартир, химчистка мебели, уборка после
      ремонта, поддерживающая уборка. У каждой карточки — иконка, название,
      описание, цена и кнопка «Заказать». Сетка адаптивная: 1 колонка на
      мобильных, 2 на планшетах, 4 на десктопе. Данные статические (массив
      services в app/page.tsx:33–62)."
  - id: task-003
    title: Форма онлайн-заявки
    description: "Создать форму заказа с полями: имя, телефон, выбор услуги,
      желаемая дата и время, адрес, комментарий. Форма открывается при нажатии
      «Заказать» на карточке услуги (услуга предвыбрана). После отправки —
      сообщение об успешной заявке. Данные пока сохраняются локально."
    status: completed
    acceptance_criteria:
      - Форма открывается по кнопке «Заказать» с предвыбранной услугой
      - Все поля формы работают и проходят валидацию
      - После отправки показывается сообщение об успешной заявке
    summary: "Создана модальная форма заказа (components/order-form-modal.tsx) с
      полями: имя, телефон, выбор услуги (Select), дата, время, адрес,
      комментарий. Форма открывается по кнопке «Заказать» на карточке услуги с
      предвыбором услуги (components/service-cards-section.tsx). Валидация через
      zod, уведомление об успехе через sonner toast. Данные сохраняются в
      localStorage."
  - id: task-004
    title: Блок «О компании» и преимущества
    description: Создать на главной странице блок с информацией о компании,
      преимуществах биоуборки (безопасные средства, гипоаллергенно, забота о
      здоровье) и блок с отзывами клиентов (статические данные-заглушки).
    status: completed
    acceptance_criteria:
      - Блок с преимуществами биоуборки отображается
      - Есть блок с 3+ отзывами клиентов
      - Информация выглядит профессионально и убедительно
    summary:
      'На главную страницу добавлен блок «О компании» (id="about") с историей
      компании и тремя карточками ценностей (забота о здоровье, профессиональная
      команда, гарантия качества), а также блок «Отзывы клиентов» с четырьмя
      статическими отзывами от жителей разных районов Ташкента, рейтингом
      (звёзды) и аватарами-инициалами. Основная реализация в app/page.tsx:
      данные testimonials (4 отзыва), values (3 ценности), JSX-секции после
      карточек услуг.'
  - id: task-005
    title: Блок контактов и соцсетей
    description: "Создать блок с контактами: телефон (кликабельный), ссылки на
      Instagram и Telegram (открываются в новой вкладке), форма обратной связи.
      Разместить в подвале и/или на главной."
    status: completed
    acceptance_criteria:
      - Номер телефона кликабельный для звонка
      - Ссылки на соцсети открываются в новой вкладке
      - Форма обратной связи работает и показывает подтверждение
    summary: 'Создана секция «Контакты» на главной странице (id="contacts") с
      кликабельным номером телефона (+998 90 123-45-67), ссылками на Instagram и
      Telegram (открываются в новой вкладке), email, и формой обратной связи
      (имя, телефон, сообщение). Форма отправляет POST-запрос на /api/feedback
      (zod-валидация), при успехе показывает toast-подтверждение. Основные
      файлы: components/contacts-section.tsx (клиентский компонент с формой),
      app/api/feedback/route.ts (API-маршрут), app/page.tsx (подключение
      секции).'
  - id: task-006
    title: Галерея работ (портфолио)
    description:
      Создать галерею с фотографиями выполненных работ. Фото отображаются
      в сетке, при нажатии открываются в увеличенном виде. Данные пока
      статические.
    status: completed
    acceptance_criteria:
      - Фотографии отображаются в аккуратной сетке
      - При нажатии на фото открывается увеличенный просмотр
      - Галерея адаптируется под мобильные устройства
    summary:
      'Создана секция «Наши работы» на главной странице (id="portfolio") с
      сеткой из 12 фото-заглушек (градиенты с иконками), фильтрацией по
      категориям (Все, Квартиры, Мебель, Офисы, После ремонта) и лайтбоксом на
      основе shadcn Dialog. Сетка адаптивная: 1 колонка на мобильных, 2 на
      планшетах, 3 на десктопе. В навигацию добавлена ссылка «Портфолио».
      Основные файлы: components/portfolio-gallery.tsx (клиентский компонент с
      сеткой, фильтрацией и Dialog-лайтбоксом), lib/gallery-data.ts (статические
      данные).'
  - id: task-007
    title: SEO-оптимизация
    description:
      "Настроить SEO: правильные meta-теги (title, description, keywords)
      для каждой страницы, Open Graph разметка для соцсетей, семантическая
      HTML-структура, alt-теги для изображений, robots.txt, sitemap.xml."
    status: completed
    acceptance_criteria:
      - Каждая страница имеет уникальные title и meta description
      - Open Graph теги корректно отображаются при шаринге
      - Семантическая HTML-структура (header, main, section, article, footer)
      - Создан robots.txt и sitemap.xml
    summary:
      "Настроена SEO-оптимизация: в app/layout.tsx добавлены metadataBase,
      Open Graph (locale ru_UZ, type website, siteName), Twitter card, keywords
      (14 целевых слов), canonical URL и title-шаблон. Главная страница в
      app/page.tsx получила уникальный title/description с переопределением OG.
      Создан app/sitemap.ts с одной записью для корневого URL (priority 1.0,
      weekly). Семантическая структура усилена: <article> для карточек услуг,
      преимуществ, ценностей и отзывов; роль group и aria-pressed для фильтров
      галереи; aria-label для кнопок просмотра и заглушек иконок. robots.ts уже
      существовал. typecheck, lint, build проходят без ошибок."
  - id: task-008
    title: Система переводов и переключатель языка
    description: "Создать систему мультиязычности на сайте: русский, узбекский
      (кириллица), узбекский (латиница). Добавить переключатель языка в шапку
      сайта. Выбор языка сохраняется при перезагрузке и повторных посещениях."
    status: completed
    acceptance_criteria:
      - Переключатель языка виден в шапке сайта
      - "Доступны 3 языка: русский, узбекский (кириллица), узбекский (латиница)"
      - Выбор языка сохраняется при перезагрузке страницы
    summary: "Создана система мультиязычности: конфиг локалей и словари в
      lib/i18n/config.ts и lib/i18n/translations.ts (RU, узбекский кириллицей,
      узбекский латиницей), клиентский LanguageProvider
      (lib/i18n/language-provider.tsx) с сохранением выбора в localStorage (ключ
      biouborka.locale) и сменой атрибута html lang. В шапку добавлен
      переключатель языка (components/language-switcher.tsx на базе shadcn
      Select), навигация переведена через клиентский components/header-nav.tsx.
      Выбор языка сохраняется при перезагрузке. typecheck, lint, build проходят
      без ошибок."
  - id: task-009
    title: Перевод контента на три языка
    description: "Перевести все тексты на сайте на три языка: русский, узбекский
      (кириллица), узбекский (латиница). Включая: навигацию, услуги, формы,
      отзывы, контакты, галерею, информацию о компании."
    status: completed
    acceptance_criteria:
      - Все тексты навигации переведены на 3 языка
      - Все услуги и карточки переведены на 3 языка
      - Формы, отзывы, контакты и галерея переведены на 3 языка
      - При смене языка не остаётся текстов на старом языке
    summary:
      Весь видимый контент сайта переведён на три языка (русский, узбекский
      кириллицей, узбекский латиницей). Словарь расширен в
      lib/i18n/translations.ts (герой, преимущества, услуги, «О компании»,
      ценности, отзывы, галерея, контакты, формы, валидация, тосты, футер).
      Добавлены lib/i18n/content.ts (метаданные контента) и клиентские
      компоненты components/home-content.tsx и components/site-footer.tsx; все
      секции и формы читают переводы через useLanguage(). Галерея и категории, а
      также сообщения валидации форм переведены. При смене языка не остаётся
      текстов на старом языке. typecheck, lint, build проходят без ошибок.
  - id: task-010
    title: SEO-теги для трёх языков
    description: Настроить SEO-теги (title, description, Open Graph) для каждого
      языка. При переключении языка meta-теги страницы должны корректно
      меняться.
    status: completed
    acceptance_criteria:
      - title и description меняются при выборе языка
      - Open Graph теги корректны для каждого языка
      - HTML lang атрибут меняется в зависимости от языка
    summary: Настроены локализованные SEO-теги для трёх языков (ru, uzKrill,
      uzLatin). Добавлен конфиг lib/i18n/seo.ts с per-language htmlLang,
      ogLocale, title и description, а также клиентский апдейтера мета-тегов
      components/seo-meta-updater.tsx, подключённый в app/layout.tsx внутри

      контактов/услуг/текстов через /api/admin/content возвращает 503, потому
      что isDatabaseAvailable() вызывает ListTablesCommand, который на Yandex
      Cloud Document API завершается ошибкой и функция возвращает false.


      Нужно: изменить isDatabaseAvailable() так, чтобы при USE_DATABASE !=
      "false" она считала базу доступной (возвращала true) на основе наличия
      переменных окружения (DOCUMENT_API_ENDPOINT, AWS_ACCESS_KEY_ID и т.д.), не
      выполняя реальный запрос ListTablesCommand. Использование DynamoDB клиента
      должно остаться прежним для остальных операций (чтение/запись таблиц уже
      работает). Убедиться, что /api/admin/content PUT (сохранение контактов)
      перестаёт возвращать 503 и успешно сохраняет данные в site_content.

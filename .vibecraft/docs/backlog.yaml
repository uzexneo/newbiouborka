      quick_implement_marker: quick_implement:call_c0dbefd487024accb4127a90
    summary:
      isDatabaseAvailable() в lib/db.ts больше не вызывает ListTablesCommand
      (который падал на Yandex Cloud Document API). Теперь при USE_DATABASE !=

         - Уникальный H1 с ключевой фразой + «в Ташкенте» (например «Уборка квартир в Ташкенте — цены от 25 000 сум»);
         - Уникальные title (~50–58 символов) и meta description (~150–160 символов) с ключевым запросом, городом Ташкент, ценой и телефоном +998 93 375 27 02;
         - Список услуг этой категории с ценами (данные из существующих SERVICE_CATEGORIES/ALL_SERVICES);
         - Блок «Как проходит процедура» для этой категории (текст и фото, как на главной);
         - Кнопку «Заказать», открывающую форму заявки с предвыбранной услугой (переиспользовать существующие OrderFormModal/QuickOrderModal);
         - Короткий FAQ-блок с 2–3 вопросами по этой услуге (цены, телефон);
         - Хлебные крошки (Главная → Услуги → Категория) и внутренние ссылки на другие категории;
         - Семантическую структуру (h1, section, article) и JSON-LD разметку Service/Offer с числовыми ценами UZS.

      3. Обновить навигацию: добавить пункт «Услуги» в шапку
      (components/header-nav.tsx), ведущий на /uslugi.


      4. Обновить app/sitemap.ts: добавить хаб и все страницы категорий с
      корректными canonical и hreflang для русского языка (база
      https://biouborka.uz).



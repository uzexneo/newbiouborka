  - id: task-011
    title: Обновить цветовую схему сайта на зелёно-белую
    description: "Заменить текущую цветовую схему сайта на сочетание зелёного и
      белого цветов, как на старом сайте biouborka.uz. Обновить: фоновые цвета,
      акцентные цвета кнопок, карточек услуг, герой-секции, подвала, шапки
      сайта, иконок и всех интерактивных элементов."
    status: completed
    acceptance_criteria:
      - Основные элементы сайта используют зелёный и белый цвета
      - Кнопки, карточки, иконки и акценты соответствуют зелёно-белой гамме
      - Цветовая схема выглядит согласованно на всех секциях сайта
      - Сайт сохраняет читаемость и контрастность
    summary:
      "Цветовая схема сайта обновлена на зелёно-белую. Основная реализация в
      app/globals.css: CSS-переменные палитры (primary, background, foreground,
      card, secondary, muted, accent, ring, sidebar, chart) переведены с
      сине-фиолетовых оттенков (около 264) на зелёные (около 150) для светлой и
      тёмной тем, а также обновлены утилиты gradient-hero, gradient-hero-light,
      gradient-hero-vibrant, gradient-card и pattern-grid (зелёные точки).
      Кнопки, карточки, иконки, герой-секция, подвал, шапка и фильтры галереи
      используют зелёный primary/белый фон через существующие
      bg-primary/text-primary. Градиенты фото-заглушек в lib/gallery-data.ts
      приведены к зелёно-белым тонам для согласованности. Читаемость и
      контрастность сохранены. typecheck, lint и build проходят без ошибок."
  - id: task-012
    title: Заменить фон герой-секции на новое фото
    description: Заменить текущий градиентный/цветовой фон герой-секции главной

      build проходят успешно."
  - id: task-2171
    title: Расширить каталог услуг полным прайс-листом
    description:
      "Расширить каталог услуг на главной странице, добавив все услуги и
      цены из прайс-листа компании. Сгруппировать услуги по категориям: Уборка,
      Мойка окон и фасадов, Химчистка ковров, Химчистка мягкой мебели, Химчистка
      матрацев, Химчистка кожаной мебели, Уход за полами, Кухня, Прочие услуги.
      У каждой услуги — название, цена и кнопка «Заказать» с предвыбором услуги
      в форме заявки. Данные должны соответствовать реальному прайс-листу."
    status: completed
    acceptance_criteria:
      - Все категории из прайс-листа отображаются на сайте (Уборка, Мойка окон,
        Химчистка ковров, Мягкая мебель, Матрацы, Кожаная мебель, Уход за
        полами, Кухня, Прочие)
      - У каждой услуги указана корректная цена из прайс-листа
      - Каталог выглядит аккуратно на мобильных и десктопе
    summary: "Каталог услуг на главной странице расширен полным прайс-листом
